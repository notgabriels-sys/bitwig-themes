name: Validate themes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Verify generated files are committed
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
